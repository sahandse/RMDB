name: Sync RMDB Telegram curator
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    environment:
      name: github-pages
      url: https://sahandse.github.io/RMDB/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required configuration
        env:
          BOT_TOKEN: ${{ secrets.RMDB_TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.RMDB_TELEGRAM_OWNER_ID }}
          CHANNEL_ID: ${{ secrets.RMDB_TELEGRAM_CHANNEL_ID }}
        run: |
          test -n "$BOT_TOKEN" || { echo 'Missing RMDB_TELEGRAM_BOT_TOKEN'; exit 1; }
          test -n "$OWNER_ID" || { echo 'Missing RMDB_TELEGRAM_OWNER_ID'; exit 1; }
          test -n "$CHANNEL_ID" || { echo 'Missing RMDB_TELEGRAM_CHANNEL_ID'; exit 1; }
          echo 'Required Telegram configuration is present (values hidden).'
      - name: Check ingestion script syntax
        run: |
          node --check scripts/cache-licensed-images.mjs
          node --check scripts/auto-import-telegram.mjs
          node --check scripts/merge-telegram-catalog.mjs
          node --check scripts/sync-telegram.mjs
      - name: Poll approved bot commands
        env:
          RMDB_TELEGRAM_BOT_TOKEN: ${{ secrets.RMDB_TELEGRAM_BOT_TOKEN }}
          RMDB_TELEGRAM_OWNER_ID: ${{ secrets.RMDB_TELEGRAM_OWNER_ID }}
          RMDB_TELEGRAM_CHANNEL_ID: ${{ secrets.RMDB_TELEGRAM_CHANNEL_ID }}
        run: node scripts/sync-telegram.mjs
      - name: Incrementally add up to 10 films and 10 series
        env:
          RMDB_TELEGRAM_BOT_TOKEN: ${{ secrets.RMDB_TELEGRAM_BOT_TOKEN }}
          RMDB_TELEGRAM_CHANNEL_ID: ${{ secrets.RMDB_TELEGRAM_CHANNEL_ID }}
        run: node scripts/auto-import-telegram.mjs
      - name: Cache permitted Wikimedia Commons images
        run: node scripts/cache-licensed-images.mjs
      - name: Commit changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/telegram-curated.json data/telegram-offset.json data/auto-import-state.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git add public/data/image-credits.json
          if [ -d public/media ]; then git add public/media; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: sync verified Telegram curator records"
            git push
          fi
      - name: Build updated catalog and public pages
        run: |
          npm install --no-audit --no-fund
          node scripts/merge-telegram-catalog.mjs
          node scripts/build-public-api.mjs
          node scripts/validate-data.mjs
          node scripts/check-telegram-pipeline.mjs
          node scripts/check-ui.mjs
          npm run build
          touch out/.nojekyll
      - name: Commit generated catalog and public API
        run: |
          git add -f public/data/catalog.json public/api/v1/index.json public/api/v1/movies.json public/api/v1/people.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish Telegram-curated RMDB catalog"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy updated pages
        uses: actions/deploy-pages@v4
