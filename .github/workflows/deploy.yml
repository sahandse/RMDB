name: Deploy RMDB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate real public catalog
        run: node scripts/refresh-catalog.mjs
      - name: Build static site
        run: npm run build
      - name: Validate exported routes
        run: |
          test -f out/index.html
          test -f out/search/index.html
          test -f out/person/index.html
          test -f out/people/index.html
          test -f out/explore/index.html
          test -f out/calendar/index.html
          test -f out/title/index.html
          test -f out/episode/index.html
          test -f out/iran/index.html
          test -f out/watchlist/index.html
          test -f out/top/index.html
          test -f out/compare/index.html
      - name: Create Pages files
        run: touch out/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
