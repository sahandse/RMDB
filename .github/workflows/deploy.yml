name: Deploy RMDB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Probe public source availability (non-blocking)
        run: node scripts/check-sources.mjs
      - name: Generate real public catalog
        run: node scripts/refresh-catalog.mjs
      - name: Generate versioned CC0 public API
        run: node scripts/build-public-api.mjs
      - name: Validate data provenance and public API licenses
        run: node scripts/validate-data.mjs
      - name: Check page branding and navigation
        run: node scripts/check-ui.mjs
      - name: Build static site
        run: npm run build
      - name: Validate exported catalog
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('out/data/catalog.json','utf8'));if(!Array.isArray(d.movies)||!Array.isArray(d.shows)||!d.shows.length)process.exit(1);console.log('Real catalog records:',d.movies.length,d.shows.length)"
      - name: Validate exported routes
        run: |
          test -f out/index.html
          test -f out/en/index.html
          test -f out/api/index.html
          test -f out/data/sources-health.json
          test -f out/actor/index.html
          test -f out/data/catalog.json
          test -f out/api/v1/index.json
          test -f out/api/v1/movies.json
          test -f out/api/v1/people.json
          test -f out/search/index.html
          test -f out/person/index.html
          test -f out/people/index.html
          test -f out/explore/index.html
          test -f out/calendar/index.html
          test -f out/title/index.html
          test -f out/episode/index.html
          test -f out/iran/index.html
          test -f out/watchlist/index.html
          test -f out/top/index.html
          test -f out/compare/index.html
          test -f out/locations/index.html
          test -f out/openapi.json
      - name: Create Pages files
        run: touch out/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
